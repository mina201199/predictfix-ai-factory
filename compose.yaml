services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_MODE: demo
      DEMO_MODE: "1"
      DATABASE_URL: postgresql+psycopg://predictfix:local-demo-only@db/predictfix
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predictfix
      POSTGRES_USER: predictfix
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictfix"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - ollama-models:/root/.ollama
volumes:
  postgres-data:
  ollama-models:
