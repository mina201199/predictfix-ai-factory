name: Tests and container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Check runtime
        run: python scripts/check_runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scan request ordering
        run: |
          node tests/scan_race.cjs
          node --check sites/predictfix-mobile/dist/app.js
          node --check scripts/serve_mobile_demo.cjs
      - name: Run all tests with no skips
        run: |
          mkdir -p .runtime
          python -m pytest -q --junitxml=.runtime/tests.xml
          python scripts/check_test_report.py .runtime/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .runtime/tests.xml
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t predictfix-ci .
      - name: Verify production-mode container
        run: |
          docker run -d --name predictfix-ci -p 127.0.0.1:18083:8080 -e APP_MODE=production -e DEMO_MODE=0 -e BOOTSTRAP_PASSWORD=CI-Isolated-Bootstrap-123456 predictfix-ci
          python3 scripts/check_container.py --url http://127.0.0.1:18083
      - name: Verify demo-mode container and mobile assets
        run: |
          docker rm -f predictfix-ci
          docker run -d --name predictfix-ci -p 127.0.0.1:18083:8080 -e APP_MODE=demo -e DEMO_MODE=0 -e BOOTSTRAP_PASSWORD=CI-Isolated-Bootstrap-123456 predictfix-ci
          python3 scripts/check_container.py --url http://127.0.0.1:18083 --mode demo
      - name: Container diagnostics
        if: failure()
        run: docker logs predictfix-ci
      - name: Stop test container
        if: always()
        run: docker rm -f predictfix-ci || true
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # 只存在於本次 job 的拋棄式資料庫，用 trust 免得把密碼寫進 workflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run production scenarios on PostgreSQL
        run: python scripts/verify_postgres.py scenarios --admin-url postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      - name: Verify compose stack, restart and pg_dump restore
        run: python scripts/verify_postgres.py container
