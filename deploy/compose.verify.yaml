# Only for scripts/verify_postgres.py: expose the API on loopback and allow plain-HTTP cookies.
services:
  api:
    ports:
      - "127.0.0.1:18084:8080"
    environment:
      COOKIE_SECURE: "0"
      # 介接金鑰由 verify_postgres.py 每次執行隨機產生；compose.production.yaml 本身沒有傳入這個設定
      INTEGRATION_SOURCES: ${INTEGRATION_SOURCES:?Set by scripts/verify_postgres.py}
