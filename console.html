<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PredictFix · 維修管理</title><link rel="stylesheet" href="console.css"><link rel="stylesheet" href="neon.css"><link rel="stylesheet" href="auth.css"></head>
<body><aside><a class="brand" href="/">PredictFix <span>AI</span></a><p id="mode">維修管理</p><nav><button data-view="tickets" class="active">維修工單</button><button data-view="machines">設備建檔</button><button data-view="dispatch">出勤與派工</button><button data-view="accounts" class="supervisor-only">人員與帳號</button><button data-view="audit" class="supervisor-only">操作紀錄</button><button data-view="password">修改密碼</button><a href="/knowledge.html">維修 AI 中心 →</a><a href="/workflow.html">維修流程・保養・備品 →</a></nav><div class="side-bottom"></div></aside>
<main class="main"><header><div><small>設備維修 / 日常作業</small><h1 id="heading">維修工單</h1></div><div class="header-right"></div></header><div id="notice" role="status" aria-live="polite"></div>
<section id="tickets" class="view"><form id="ticket-form" class="card"><h2>通報異常</h2><label>設備<select name="machine" id="ticket-machine" required></select></label><label>異常描述<input name="issue" required maxlength="160"></label><button class="btn primary">建立待指派工單</button></form><div id="ticket-list"></div></section>
<section id="machines" class="view" hidden><form id="machine-form" class="card supervisor-only"><h2>新增真實設備</h2><div class="grid"><label>設備編號<input name="id" required maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{1,29}"></label><label>設備名稱<input name="name" required minlength="2" maxlength="50"></label><label>類型<select name="kind"><option value="mill">加工中心</option><option value="lathe">車床</option></select></label><label>機型<input name="machine_model" maxlength="100" required></label><label>製造商<input name="manufacturer" maxlength="100"></label><label>序號<input name="serial_number" maxlength="100"></label></div><button class="btn primary">保存設備</button><p>尚未接入感測器，設備量測與健康狀態為未知。</p></form><div id="machine-list"></div></section>
<section id="dispatch" class="view" hidden><form id="duty-form" class="card supervisor-only"><h2>登錄排班與出勤</h2><div class="grid"><label>工程師<select name="username" id="duty-user" required></select></label><label>出勤<select name="attendance"><option value="scheduled">已排班，未確認到班</option><option value="present">已確認到班</option><option value="leave">請假</option><option value="absent">未到班</option></select></label><label>開始（台灣時間）<input type="datetime-local" name="starts_at" required></label><label>結束（台灣時間）<input type="datetime-local" name="ends_at" required></label><label>本班可維修工時（分鐘）<input name="capacity_minutes" type="number" min="0" max="1440" required value="360"></label><label>備註<input name="note" maxlength="500"></label></div><button class="btn primary">保存班次</button></form><div id="duty-list"></div><form id="dispatch-form" class="card"><h2>查詢目前可派人員</h2><label>需求技能／零件<input name="part" placeholder="主軸、PLC、冷卻"></label><label>預估新案工時（分鐘）<input name="minutes" type="number" min="1" max="100000" value="60" required></label><button class="btn primary">推薦工程師</button><p>只把出勤已確認、資格符合且剩餘工時足夠的人列為可派；未估時案件會阻擋自動推薦。</p></form><div id="dispatch-list"></div></section>
<section id="accounts" class="view" hidden><form id="user-form" class="card supervisor-only"><h2>建立人員帳號</h2><div class="grid"><label>帳號<input name="username" required pattern="[a-z][a-z0-9_.-]{2,49}" maxlength="50" autocomplete="off"></label><label>姓名<input name="name" required minlength="2" maxlength="50"></label><label>角色<select name="role"><option value="engineer">工程師</option><option value="supervisor">主管</option></select></label><label>初始密碼<input name="password" type="password" required minlength="16" maxlength="200" autocomplete="new-password"></label><label>專長<input name="specialty" maxlength="100"></label><label>技能（逗號分隔）<input name="skills" placeholder="主軸,軸承"></label><label>資格（逗號分隔）<input name="qualifications" placeholder="內部電控維修授權"></label></div><button class="btn primary">建立帳號</button></form><div id="user-list"></div></section>
<section id="audit" class="view" hidden><div class="card"><h2>最近操作紀錄</h2><p>紀錄帳號管理、出勤、派工、工時與案例發布；不記錄密碼。這是應用程式稽核紀錄，尚未接外部不可竄改儲存。</p><div id="audit-list"></div></div></section>
<section id="password" class="view" hidden><form id="password-form" class="card"><h2>修改自己的密碼</h2><label>目前密碼<input name="current_password" type="password" required autocomplete="current-password"></label><label>新密碼（至少 16 字元）<input name="password" type="password" required minlength="16" maxlength="200" autocomplete="new-password"></label><button class="btn primary">更新並登出所有工作階段</button></form></section>
</main><dialog id="editor"><button type="button" id="close-editor" class="btn">關閉</button><div id="editor-notice" role="status"></div><div id="editor-content"></div></dialog><script src="auth.js"></script><script src="console.js"></script><script src="templates.js"></script></body></html>
