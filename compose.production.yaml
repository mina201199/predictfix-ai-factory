services:
  api:
    build: .
    environment:
      APP_MODE: production
      DEMO_MODE: "0"
      COOKIE_SECURE: "1"
      DATABASE_URL: ${DATABASE_URL:?Set a PostgreSQL connection URL in the deployment env file}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set a unique 16+ character bootstrap password}
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b-it-q8_0}
      # 選填：不使用工單介接的部署不必設定，未設定時介接入口一律回 401
      INTEGRATION_SOURCES: ${INTEGRATION_SOURCES:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  integration-worker:
    build: .
    command: ["python", "-m", "backend.integration_worker"]
    environment:
      APP_MODE: production
      DEMO_MODE: "0"
      DATABASE_URL: ${DATABASE_URL:?Set a PostgreSQL connection URL in the deployment env file}
      INTEGRATION_SOURCES: ${INTEGRATION_SOURCES:-}
    depends_on:
      db:
        condition: service_healthy
      # 等 api 完成建表再啟動，避免兩個程序同時對空資料庫執行 create_all
      api:
        condition: service_healthy
    # 沒有 HTTP port 可做 healthcheck；資料庫斷線時程序會結束，由 restart 重新啟動。
    # 送達失敗不會結束程序，而是記在 outbox 的 state／lastError 供主管查看。
    restart: unless-stopped
    # Python 是容器的 PID 1，會忽略 SIGTERM；改送 SIGINT 走程式既有的 KeyboardInterrupt 結束流程
    stop_signal: SIGINT
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predictfix
      POSTGRES_USER: predictfix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - production-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictfix -d predictfix"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - production-models:/root/.ollama
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the real deployment domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  production-db:
  production-models:
  caddy-data:
  caddy-config:
