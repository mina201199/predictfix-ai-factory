<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>PredictFix AI End</title>
<link rel="stylesheet" href="card.css">
<style>
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wordmark{font-size:88px;animation-delay:.1s}
.tag{display:flex;gap:28px;margin:18px 0 50px;font-size:40px;font-weight:700;color:#4b6875}
.tag span{animation:lit .5s forwards}
.tag span:nth-child(1){animation-delay:1.9s}.tag span:nth-child(3){animation-delay:2.6s}.tag span:nth-child(5){animation-delay:3.3s}
.tag em{font-style:normal;color:#2a4654}
@keyframes lit{to{color:var(--text);text-shadow:0 0 22px rgba(34,211,238,.55)}}
.stats{display:grid;grid-template-columns:repeat(4,250px);gap:20px}
.stat{padding:22px 18px;border-radius:16px;border:1.5px solid var(--line);background:linear-gradient(180deg,#10293a,#0b1d29);text-align:left}
.stat:nth-child(1){animation-delay:.5s}.stat:nth-child(2){animation-delay:.7s}.stat:nth-child(3){animation-delay:.9s}.stat:nth-child(4){animation-delay:1.1s}
.stat b{display:block;font-size:44px;line-height:1.1;color:var(--cyan);font-weight:800}
.stat b small{font-size:22px;color:var(--text);margin-left:4px}
.stat p{margin-top:8px;font-size:18px;color:var(--muted);line-height:1.45}
.repo{display:flex;align-items:center;gap:14px;margin-top:52px;font-size:28px;font-weight:600;animation-delay:1.5s}
.repo svg{width:34px;height:34px;fill:var(--text)}
.note{margin-top:16px;font-size:18px;color:var(--muted);animation-delay:1.7s}
</style></head>
<body><div class="stage"><div class="grid"></div>
<div class="wrap">
  <div class="wordmark in">PredictFix <b>AI</b></div>
  <div class="tag"><span>有依據</span><em>·</em><span>有驗收</span><em>·</em><span>能累積</span></div>
  <div class="stats">
    <div class="stat in"><b>40<small>項</small></b><p>自動化測試通過<br>零跳過</p></div>
    <div class="stat in"><b>45<small>項</small></b><p>安全檢查通過<br>含 8 個本機模型攻擊情境</p></div>
    <div class="stat in"><b>本機</b><p>Qwen3-0.6B · llama.cpp<br>只選段落，不判定復機</p></div>
    <div class="stat in"><b>5<small>步</small></b><p>報修 → 清單 → 派工<br>→ 復測 → 審核與案例</p></div>
  </div>

</div></div></body></html>
